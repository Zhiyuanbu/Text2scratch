name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Audit
        run: npm run audit:high

      - name: Build site
        run: npm run build

      - name: Prepare static output
        run: touch dist/.nojekyll

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true

      - name: Point Pages to gh-pages
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                build_type: "legacy",
                source: {
                  branch: "gh-pages",
                  path: "/"
                }
              });
              core.info("GitHub Pages source set to gh-pages.");
            } catch (error) {
              core.warning(`Could not update GitHub Pages source: ${error.message}`);
            }

      - name: Trigger Pages build
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              await github.request("POST /repos/{owner}/{repo}/pages/builds", {
                owner,
                repo
              });
              core.info("GitHub Pages build requested.");
            } catch (error) {
              core.warning(`Could not trigger GitHub Pages build: ${error.message}`);
            }
